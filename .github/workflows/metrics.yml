# Genera github-metrics.svg con lowlighter/metrics.
# Opciones: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics
on:
  # Todos los días a las 5:00 (Bogotá)
  schedule: [{cron: "0 10 * * *"}]
  # Manual: Actions → Metrics → Run workflow
  workflow_dispatch:
  # Al hacer push a main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Bogota

          # Lenguajes más usados en tus repositorios
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_colors: github

          # Calendario de contribuciones en 3D
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Quitados porque salían vacíos o con error:
          #  - plugin_traffic: exige que METRICS_TOKEN tenga el permiso "repo"
          #    (mostraba "Insufficient token scopes").
          #  - plugin_stargazers y plugin_reactions: sin datos, solo gráficas en cero.
