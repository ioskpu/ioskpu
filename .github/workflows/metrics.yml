# Genera github-metrics.svg con lowlighter/metrics.
# Opciones: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics
on:
  # Todos los días a las 5:00 (Bogotá)
  schedule: [{cron: "0 10 * * *"}]
  # Manual: Actions → Metrics → Run workflow
  workflow_dispatch:
  # Al hacer push a main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          # Versión corta: quién eres y tu actividad (sin las secciones de ceros).
          base: header, activity
          config_timezone: America/Bogota

          # Lenguajes más usados en tus repositorios
          plugin_languages: yes
          plugin_languages_limit: 6

          # Hábitos: a qué hora y qué días programas más
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: no
          plugin_habits_days: 30

          # El calendario de contribuciones ya lo muestra GitHub debajo del README,
          # por eso no se repite aquí.
